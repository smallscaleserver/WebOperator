services:
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-weboperator}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-changeme123}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - ./data/minio:/data

  browser-worker-chrome:
    build: ./services/browser-worker
    environment:
      - BROWSER=chromium
      - RESOLUTION=1366x768x24
      - VNC_PASSWORD=${VNC_PASSWORD:-changeme}
    ports:
      - "6080:6080"
    volumes:
      - ./data/profiles/chrome:/data/profile
    shm_size: "2gb"

  browser-worker-firefox:
    build: ./services/browser-worker
    environment:
      - BROWSER=firefox
      - RESOLUTION=1366x768x24
      - VNC_PASSWORD=${VNC_PASSWORD:-changeme}
    ports:
      - "6081:6080"
    volumes:
      - ./data/profiles/firefox:/data/profile
    shm_size: "2gb"

  worker:
    build: ./services/worker
    environment:
      - CDP_URL=http://localhost:9222
      - MINIO_ENDPOINT=minio
    volumes:
      - ./services/worker/src:/app/src
      - ./services/worker/workflows:/app/workflows
      - ./data/worker-output:/app/output
      - ./data/sessions:/app/sessions
    network_mode: "service:browser-worker-chrome"
    depends_on:
      - browser-worker-chrome

  worker-firefox:
    build: ./services/worker
    environment:
      - FIREFOX_WS_ENDPOINT=ws://localhost:9223/firefox
      - MINIO_ENDPOINT=minio
    volumes:
      - ./services/worker/src:/app/src
      - ./services/worker/workflows:/app/workflows
      - ./data/worker-output:/app/output
      - ./data/sessions:/app/sessions
    network_mode: "service:browser-worker-firefox"
    depends_on:
      - browser-worker-firefox
