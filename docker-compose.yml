services:
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-weboperator}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-changeme123}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - ./data/minio:/data

  # Isolated mock third-party test target -- WebOperator's worker treats
  # this exactly like a real external site (browser/HTTP only, no shared
  # code/DB/queue/artifact store). See docs/PROJECT_PLAN.md decision log.
  xc-bank:
    build: ./services/xc-bank
    ports:
      - "127.0.0.1:4100:3000"

  # Isolated mock of SCB Business Anywhere, same relationship/isolation
  # posture as xc-bank above (in-memory only, no shared code/DB with
  # WebOperator, HTTP-only channel) -- built so record-analyze-run and
  # the balance/transaction monitor can be safely tested end-to-end
  # without touching the real account. See docs/PROJECT_PLAN.md's
  # decision log for why this exists and how closely its DOM text
  # mirrors the real site (it has to, for the same getByText-driven
  # scripts to work against either one unchanged).
  scb-mock:
    build: ./services/scb-mock
    ports:
      - "127.0.0.1:4101:3000"
    volumes:
      # User-editable convenience file, host-editable/gitignored (see
      # .gitignore) -- pre-fills the mock's login form fields so
      # there's nothing to remember/retype. Safe to read automatically
      # here specifically because this mock never validates against
      # it (any non-empty value already works) -- unlike .userpass,
      # which the bot never reads for any real site.
      - ./.userpassmock:/app/.userpassmock:ro

  browser-worker-chrome:
    build: ./services/browser-worker
    environment:
      - BROWSER=chromium
      - RESOLUTION=1366x768x24
      - VNC_PASSWORD=${VNC_PASSWORD:-changeme}
    ports:
      - "6080:6080"
    volumes:
      - ./data/profiles/chrome:/data/profile
    shm_size: "2gb"

  browser-worker-firefox:
    build: ./services/browser-worker
    environment:
      - BROWSER=firefox
      - RESOLUTION=1366x768x24
      - VNC_PASSWORD=${VNC_PASSWORD:-changeme}
    ports:
      - "6081:6080"
    volumes:
      - ./data/profiles/firefox:/data/profile
    shm_size: "2gb"

  worker:
    build: ./services/worker
    environment:
      - CDP_URL=http://localhost:9222
      - MINIO_ENDPOINT=minio
    volumes:
      - ./services/worker/src:/app/src
      - ./services/worker/workflows:/app/workflows
      - ./data/worker-output:/app/output
      - ./data/sessions:/app/sessions
      - ./data/recordings/shared:/app/recordings
    network_mode: "service:browser-worker-chrome"
    depends_on:
      - browser-worker-chrome

  worker-firefox:
    build: ./services/worker
    environment:
      - FIREFOX_WS_ENDPOINT=ws://localhost:9223/firefox
      - MINIO_ENDPOINT=minio
    volumes:
      - ./services/worker/src:/app/src
      - ./services/worker/workflows:/app/workflows
      - ./data/worker-output:/app/output
      - ./data/sessions:/app/sessions
    network_mode: "service:browser-worker-firefox"
    depends_on:
      - browser-worker-firefox

  # First real "lane" (see docs/BOT_LANE_ISOLATION.md): a genuinely
  # separate Chromium instance + profile for the scb-business-anywhere
  # site/account (laneId scb-business-anywhere-1, accountId
  # manual-admin), so it never shares a browser context/cookies/session
  # with browser-worker-chrome (used by XC Bank and other testing).
  # Own noVNC port (6090, not published beyond 127.0.0.1) and own
  # bind-mounted profile/output/sessions under
  # data/lanes/scb-business-anywhere-1/ -- nothing here is read by or
  # written to by any other service. No login/OTP automation exists for
  # this lane yet -- manual takeover via noVNC only, see
  # docs/PROJECT_PLAN.md decision log.
  browser-worker-scb-business-anywhere-1:
    build: ./services/browser-worker
    environment:
      - BROWSER=chromium
      - RESOLUTION=1366x768x24
      - VNC_PASSWORD=${VNC_PASSWORD:-changeme}
      # Real bank site displays dates in the browser's own local
      # timezone (see the Dockerfile's tzdata comment) -- without this,
      # the container's default (UTC) leaked into displayed transaction
      # times, found from a real report that they didn't match actual
      # Thailand time.
      - TZ=Asia/Bangkok
    ports:
      - "127.0.0.1:6090:6080"
    volumes:
      - ./data/lanes/scb-business-anywhere-1/profile:/data/profile
    shm_size: "2gb"

  worker-scb-business-anywhere-1:
    build: ./services/worker
    environment:
      - CDP_URL=http://localhost:9222
      - MINIO_ENDPOINT=minio
    volumes:
      - ./services/worker/src:/app/src
      - ./services/worker/workflows:/app/workflows
      - ./data/lanes/scb-business-anywhere-1/output:/app/output
      - ./data/lanes/scb-business-anywhere-1/sessions:/app/sessions
      - ./data/lanes/scb-business-anywhere-1/recordings:/app/recordings
    network_mode: "service:browser-worker-scb-business-anywhere-1"
    depends_on:
      - browser-worker-scb-business-anywhere-1
